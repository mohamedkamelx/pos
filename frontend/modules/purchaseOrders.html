<div class="vertical-layout page_loader" id="purchaseorders_new" style="display: none">
    <!-- Purchases: the stock and the money, recorded together when the bill
         is entered. Legacy purchase orders remain readable here. -->
    <div id="containerbar">
        <div class="breadcrumbbar crumbbar_padding">
            <div class="row align-items-center row_filter">
                <div class="col-auto">
                    <h4 class="page-title break_title mb-0"><lang class="lang_po_title">Purchases</lang></h4>
                </div>
                <!-- The one purchasing door: recording a purchase and reading
                     its history both start here. -->

                <div class="col-auto text-right ml-auto lf-actions">
                    <div class="widgetbar" id="purchases_controls">
                        <button type="button" class="btn btn-primary-rgba" onclick="PosnicPro.purchaseorders.exportCsv();"
                            data-toggle="tooltip" title="Export the filtered rows" data-t-title="lang_export_the_filtered_rows" aria-label="Export CSV" data-t-aria-label="lang_export_csv">
                            <i class="feather icon-share mr-1"></i><span class="list-file-action-label" data-t="lang_export"><lang class="lang_export">Export</lang></span>
                        </button>
                        <span id="purchases_sort_host"></span>
                        <button type="button" class="btn btn-primary-rgba lf-btn" id="purchases_filter_btn"
                            data-toggle="tooltip" title="Filter purchases" data-t-title="lang_filter_purchases">
                            <i class="feather icon-filter mr-2"></i><lang class="lang_filter">Filter</lang>
                        </button>
                        <a data-module="receiving" data-access="write" href="#/receivings/new"
                            class="btn btn-primary-rgba" data-toggle="tooltip" title="Record as purchase" data-t-title="lang_record_as_purchase">
                            <i class="feather icon-plus mr-2"></i><lang class="lang_new_purchase">New Purchase</lang>
                        </a>
                    </div>
                </div>
                <div class="col-12 lf-toolbar-slot">
                    <div class="lf-panel" id="purchases_filter_panel" style="display:none;"></div>
                    <div class="transaction-filter-summary">
                        <div id="po_active_filters" class="lf-applied" aria-live="polite"></div>
                        <div id="po_summary" class="list-metrics" role="status"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="contentbar">
        <!-- 1 · Purchases, built to LIST_PAGE_UX_STANDARD.md: a full-width
             list first (control row: Filter top-left, New beside it, quiet
             utilities right); a row click enters the split via
             PosnicPro.masterDetail and the document opens beside the rail. -->
        <div id="po_list_section">
            <div id="purchases_split">
                <div class="card m-b-30 md-rail" id="purchases_list_card">
                    <div class="card-body">
                        <div id="po_list_rows" class="md-rail-rows text-muted"><lang class="lang_loading_purchases">Loading purchases ...</lang></div>
                        <div class="q-pager" id="po_list_paging"></div>
                    </div>
                </div>
                <div class="card m-b-30 md-detail" id="purchases_detail_card" style="display:none;">
                    <div id="purchases_doc"></div>
                    <div id="purchases_po_host" style="display:none;"></div>
                </div>
            </div>
        </div>

        <!-- 3 · View -->
        <div id="po_view_section" style="display:none;">
            <div class="card m-b-30">
                <div class="card-header d-flex align-items-center justify-content-between flex-wrap">
                    <h5 class="card-title mb-0"><span id="po_view_id"></span> <span class="badge badge-primary-inverse ml-2" id="po_view_status"></span></h5>
                    <div id="po_view_actions"></div>
                </div>
                <div class="card-body">
                    <div class="row mb-2">
                        <div class="col-md-4"><small class="text-muted d-block"><lang class="lang_supplier_title">Supplier</lang></small><span id="po_view_supplier"></span></div>
                        <div class="col-md-3"><small class="text-muted d-block"><lang class="lang_date_title">Date</lang></small><span id="po_view_date"></span></div>
                        <div class="col-md-3"><small class="text-muted d-block"><lang class="lang_expected">Expected</lang></small><span id="po_view_expected"></span></div>
                    </div>
                    <div class="mb-2" id="po_view_progress"></div>
                    <div style="overflow-x:auto;">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th><lang class="lang_item_title">Item</lang></th>
                                    <th class="text-right"><lang class="lang_po_ordered">Ordered</lang></th>
                                    <th class="text-right"><lang class="lang_po_received">Received</lang></th>
                                    <th class="text-right"><lang class="lang_po_cost">Purchase cost</lang></th>
                                    <th class="text-right"><lang class="lang_amount_title">Amount</lang></th>
                                </tr>
                            </thead>
                            <tbody id="po_view_rows"></tbody>
                        </table>
                    </div>
                    <div id="po_view_costs" class="text-right"></div>
                    <div class="text-right mt-2"><lang class="lang_total_title">Total</lang>: <b id="po_view_total"></b></div>
                    <div class="mt-2 text-muted" id="po_view_notes"></div>

                    <!-- The paperwork that belongs to this purchase: the
                         supplier's own PO, invoice scans, delivery notes.
                         Owner: "we cant upload any file. supplier po or
                         some other stuff." -->
                    <div class="mt-3 pt-3" style="border-top:1px dashed rgba(127,127,127,.3);">
                        <div class="d-flex align-items-center" style="gap:10px;">
                            <h6 class="mb-0"><lang class="lang_po_attachments">Attachments</lang></h6>
                            <label class="btn btn-sm btn-primary-rgba mb-0" data-module="receiving" data-access="write">
                                <i class="feather icon-paperclip mr-1"></i><lang class="lang_po_attach">Attach a file</lang>
                                <input type="file" id="po_attach_file" accept="application/pdf,image/*" style="display:none;">
                            </label>
                            <small class="text-muted"><lang class="lang_po_attach_hint">PDF or image, up to 10MB</lang></small>
                        </div>
                        <ul class="list-unstyled mb-0 mt-2" id="po_view_attachments"></ul>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
