name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A called workflow keeps the caller's ref. Including github.workflow keeps a
# release or beta caller out of the same group as the push that started CI, so
# one run cannot cancel the other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix api --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund

      - name: Build the pages the desktop checks read
        run: npm run prepare:frontend

      - name: Run the local check suite
        run: npm run check
