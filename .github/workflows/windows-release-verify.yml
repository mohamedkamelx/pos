name: Verify Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.9.2
        required: true
        type: string
      commit:
        description: 40-character source commit for the tag
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 of the approved WINDOWS-RELEASE.json
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  verify:
    name: Verify the local Windows build
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Check out the verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Download and verify the release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: node scripts/verify-windows-release.js

      - name: Verify the publisher certificate and timestamp
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem windows-release -Filter *.exe | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              Write-Error "$($_.Name) is not validly signed: $($signature.Status)"
              $failed = $true
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              Write-Error "$($_.Name) has no trusted timestamp"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Attest the verified Windows files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: windows-release/SHA256SUMS.txt
          predicate-type: urn:posnic:attestation:windows-release-verification:v1
          predicate-path: windows-release/verification-predicate.json
